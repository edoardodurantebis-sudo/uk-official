name: Export Claude Source Pack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-claude-source-pack.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source-only pack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, os
          root=Path('.')
          out=Path('_claude_source_pack')
          out.mkdir(exist_ok=True)
          allowed={'.py','.yml','.yaml','.json','.toml','.ini','.cfg','.md','.txt','.sh','.ps1','.sql','.bat'}
          excluded={'.git','data','raw','artifacts','.venv','venv','__pycache__','node_modules','.pytest_cache','.mypy_cache','.ruff_cache'}
          special={'requirements.txt','pyproject.toml','poetry.lock','Pipfile','Pipfile.lock','Dockerfile','Makefile','LICENSE','README','README.md'}
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              rel=p.relative_to(root)
              if any(part in excluded for part in rel.parts):
                  continue
              if p.stat().st_size > 2_000_000:
                  continue
              if p.name in special or p.suffix.lower() in allowed or p.name.endswith('.env.example'):
                  dest=out/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,dest)
          (out/'_PACK_INFO.txt').write_text(f"repository={os.environ.get('GITHUB_REPOSITORY')}\ncommit={os.environ.get('GITHUB_SHA')}\nref={os.environ.get('GITHUB_REF')}\n",encoding='utf-8')
          PY
          find _claude_source_pack -type f | sort > _claude_source_pack/_FILELIST.txt
      - name: Upload source pack
        uses: actions/upload-artifact@v4
        with:
          name: claude-source-${{ github.event.repository.name }}-${{ github.run_id }}
          path: _claude_source_pack/
          retention-days: 7
          compression-level: 6
