name: GB Live Recovery Watchdog

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GB Alien Live Sensor + Brain"]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: gb-live-recovery-watchdog
  cancel-in-progress: true

jobs:
  retry-failed-live:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed live cycle with cap
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if (( RUN_ATTEMPT >= 3 )); then
            echo "RETRY_CAP_REACHED — hourly/scheduled watchdog remains available."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "LIVE_AUTOMATIC_RETRY_REQUESTED"

  heartbeat-rescue:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restart live sensor if stale
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/alien-continuous.yml/runs?per_page=30" > /tmp/live-runs.json

          ACTION="$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          runs=json.load(open('/tmp/live-runs.json')).get('workflow_runs', [])
          if any(r.get('status') in {'queued','in_progress','pending','waiting','requested'} for r in runs):
              print('ACTIVE'); raise SystemExit
          successes=[r for r in runs if r.get('status') == 'completed' and r.get('conclusion') == 'success']
          if not successes:
              print('DISPATCH'); raise SystemExit
          latest=max(successes, key=lambda r: r.get('updated_at') or r.get('created_at') or '')
          ts=latest.get('updated_at') or latest.get('created_at')
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(ts.replace('Z','+00:00'))).total_seconds()
          print('DISPATCH' if age > 1800 else 'HEALTHY')
          PY
          )"
          echo "live_watchdog_action=${ACTION}"
          if [[ "$ACTION" != "DISPATCH" ]]; then exit 0; fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/alien-continuous.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "STALE_LIVE_RESTARTED"
