name: GB Alien Control Plane

on:
  push:
    branches: [main]
    paths-ignore:
      - 'live/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: gb-alien-control-plane
  cancel-in-progress: false

jobs:
  quality-and-public-data-health:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q
      - name: Runner self-test
        run: python gb_power_runner.py --self-test
      - name: Continuous watcher self-test
        run: python GB_ALIEN_CONTINUOUS.py --self-test
      - name: Broad live daemon self-test
        run: python GB_ALIEN_LIVE_DAEMON.py --duration-seconds 3 --dry-run --output-dir live_daemon_test
      - name: Elexon Insights public API health
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://data.elexon.co.uk/bmrs/api/v1/datasets/METADATA/latest'
          with urllib.request.urlopen(url, timeout=30) as r:
              payload = json.load(r)
              assert r.status == 200
              assert payload is not None
          print('ELEXON_PUBLIC_API=PASS')
          PY

  continuous-live-watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Watch and interpret every second for 285 seconds
        run: |
          python GB_ALIEN_CONTINUOUS.py --duration-seconds 285 --poll-seconds 1 &
          P1=$!
          python GB_ALIEN_LIVE_DAEMON.py --duration-seconds 285 --tick-seconds 1 --output-dir live/daemon &
          P2=$!
          wait $P1
          wait $P2
      - name: Persist compact public state without merge conflicts
        run: |
          git config user.name 'gb-alien-bot'
          git config user.email 'gb-alien-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add live/LATEST.md live/state.json live/daemon/LATEST.json live/daemon/FINAL.json
            if git diff --cached --quiet; then
              echo 'No state changes'
              exit 0
            fi
            git commit -m 'alien: update live market state [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying"
            sleep 2
          done
          exit 1
      - name: Chain next live watcher
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          curl --fail-with-body -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/alien-control-plane.yml/dispatches" \
            -d '{"ref":"main"}'
