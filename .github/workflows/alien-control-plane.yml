name: GB Alien Control Plane

on:
  push:
    branches: [main]
    paths-ignore:
      - 'live/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: gb-alien-control-plane
  cancel-in-progress: false

jobs:
  quality-and-public-data-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q
      - name: Runner self-test
        run: python gb_power_runner.py --self-test
      - name: Continuous watcher self-test
        run: python GB_ALIEN_CONTINUOUS.py --self-test
      - name: Elexon Insights public API health
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://data.elexon.co.uk/bmrs/api/v1/datasets/METADATA/latest'
          with urllib.request.urlopen(url, timeout=30) as r:
              payload = json.load(r)
              assert r.status == 200
              assert payload is not None
          print('ELEXON_PUBLIC_API=PASS')
          PY

  continuous-live-watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Watch every second for 285 seconds
        run: python GB_ALIEN_CONTINUOUS.py --duration-seconds 285 --poll-seconds 1
      - name: Persist compact public state
        run: |
          git config user.name 'gb-alien-bot'
          git config user.email 'gb-alien-bot@users.noreply.github.com'
          git add live/LATEST.md live/state.json
          if git diff --cached --quiet; then
            echo 'No state changes'
            exit 0
          fi
          git commit -m 'alien: update live market state [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
