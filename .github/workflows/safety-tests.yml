name: Public Live Safety Tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ['GB_ALIEN_CONTINUOUS.py', 'tests/**', '.github/workflows/safety-tests.yml']
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow
      - run: python -m unittest discover -s tests -v
      - run: python GB_ALIEN_CONTINUOUS.py --self-test
      - name: Scan reachable public history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact=100 --report-format json --report-path /tmp/security-audit.json --no-banner --log-level error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/security-audit.json
          if-no-files-found: error
          retention-days: 7
