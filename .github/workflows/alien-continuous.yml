name: GB Alien Live Sensor + Brain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alien-continuous.yml'
      - 'GB_ALIEN_CONTINUOUS.py'
      - 'GB_ALIEN_BRAIN_ORCHESTRATOR.py'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: gb-alien-public-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile GB_ALIEN_CONTINUOUS.py GB_ALIEN_BRAIN_ORCHESTRATOR.py
          python GB_ALIEN_CONTINUOUS.py --self-test

      - name: Observe Elexon publications
        run: python GB_ALIEN_CONTINUOUS.py --duration-seconds 240 --poll-seconds 1

      - name: Interpret state with market-memory brain
        run: python GB_ALIEN_BRAIN_ORCHESTRATOR.py

      - name: Health gate
        shell: bash
        run: |
          set -euo pipefail
          test -s live/LATEST.md
          test -s live/state.json
          test -s live/market_memory.jsonl
          test -s live/brain/LATEST.json
          test -s live/brain/LATEST.md
          grep -q 'GB_ALIEN_CONTINUOUS_V1.1.0' live/LATEST.md
          grep -q 'GB_ALIEN_BRAIN_ORCHESTRATOR_1.0.0' live/brain/LATEST.md
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('live/state.json').read_text())
          brain=json.loads(Path('live/brain/LATEST.json').read_text())
          if not state:
              raise SystemExit('EMPTY_LIVE_STATE')
          if not brain:
              raise SystemExit('EMPTY_BRAIN_STATE')
          print('LIVE_STATE_CERTIFIED')
          PY

      - name: Persist live state safely
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_DIR="${RUNNER_TEMP}/live-observation"
          mkdir -p "${SNAPSHOT_DIR}"
          cp live/LATEST.md "${SNAPSHOT_DIR}/LATEST.md"
          cp live/state.json "${SNAPSHOT_DIR}/state.json"

          git config user.name 'gb-alien-live-bot'
          git config user.email 'gb-alien-live-bot@users.noreply.github.com'

          # A chained dispatch can resolve "main" a few seconds before the
          # previous cycle's live-state commit becomes visible. Never rebase
          # generated live files: refresh main, restore only this observation,
          # then rebuild the Brain against the newest canonical memory.
          for attempt in 1 2 3 4 5; do
            echo "LIVE_PERSIST_ATTEMPT=${attempt}"
            git fetch origin main
            git reset --hard origin/main

            mkdir -p live
            cp "${SNAPSHOT_DIR}/LATEST.md" live/LATEST.md
            cp "${SNAPSHOT_DIR}/state.json" live/state.json
            python GB_ALIEN_BRAIN_ORCHESTRATOR.py

            git add live/LATEST.md live/state.json live/brain/LATEST.json live/brain/LATEST.md
            git add -f live/market_memory.jsonl
            if git diff --cached --quiet; then
              echo 'No live state changes after refresh'
              exit 0
            fi
            git commit -m 'alien-live: update public market state [skip ci]'

            if git push origin HEAD:main; then
              echo "LIVE_STATE_PUSH_OK attempt=${attempt}"
              exit 0
            fi

            echo "LIVE_STATE_PUSH_RACE attempt=${attempt}"
            sleep $((attempt * 2))
          done
          echo 'LIVE_STATE_PERSISTENCE_FAILED'
          exit 1

      - name: Chain next healthy cycle
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/alien-continuous.yml/dispatches" \
            -d '{"ref":"main"}'
