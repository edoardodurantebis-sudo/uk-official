name: GB Alien Live Sensor + Brain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alien-continuous.yml'
      - 'GB_ALIEN_CONTINUOUS.py'
      - 'GB_ALIEN_BRAIN_ORCHESTRATOR.py'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: gb-alien-public-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and self-test
        run: |
          python -m py_compile GB_ALIEN_CONTINUOUS.py GB_ALIEN_BRAIN_ORCHESTRATOR.py
          python GB_ALIEN_CONTINUOUS.py --self-test

      - name: Observe Elexon publications
        run: python GB_ALIEN_CONTINUOUS.py --duration-seconds 240 --poll-seconds 1

      - name: Interpret state with market-memory brain
        run: python GB_ALIEN_BRAIN_ORCHESTRATOR.py

      - name: Health gate
        run: |
          test -s live/LATEST.md
          test -s live/state.json
          test -s live/market_memory.jsonl
          test -s live/brain/LATEST.json
          test -s live/brain/LATEST.md
          grep -q 'GB_ALIEN_CONTINUOUS_V1.1.0' live/LATEST.md
          grep -q 'GB_ALIEN_BRAIN_ORCHESTRATOR_1.0.0' live/brain/LATEST.md

      - name: Persist live state safely
        run: |
          git config user.name 'gb-alien-live-bot'
          git config user.email 'gb-alien-live-bot@users.noreply.github.com'
          git add live/LATEST.md live/state.json live/brain/LATEST.json live/brain/LATEST.md
          git add -f live/market_memory.jsonl
          if git diff --cached --quiet; then
            echo 'No live state changes'
            exit 0
          fi
          git commit -m 'alien-live: update public market state [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
            sleep 2
          done
          echo 'STATE_PUSH_DEFERRED_TO_NEXT_CYCLE'
          exit 0

      - name: Chain next healthy cycle
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/alien-continuous.yml/dispatches" \
            -d '{"ref":"main"}'
